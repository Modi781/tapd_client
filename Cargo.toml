[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/tapd-core",
    "crates/tapd-mcp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.dev]
# Keep dev builds responsive while still allowing debugging.
incremental = true
